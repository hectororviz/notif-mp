name: Build Notif-MP APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v3
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk notif-mp.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: notif-latest
          name: Notif-MP (latest)
          body: APK debug automático de cada push a main que toca android/.
          files: notif-mp.apk
